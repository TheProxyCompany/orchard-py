name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: [self-hosted, ci-cd]
    timeout-minutes: 60
    env:
      PATH: /opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      PIE_REVISION: bafaa149ab89bda584295ee3e577db8e489b372b

    steps:
      - name: Get the App's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout orchard-py
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list cmake || brew install cmake
          brew list ccache || brew install ccache
          brew list rust || brew install rust
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf "%s\n" "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            if [ -x "/opt/homebrew/opt/rustup/bin/rustup" ]; then
              export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
              echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
            else
              brew link --overwrite rust || true
            fi
          fi
          cargo --version

      - name: Checkout PIE
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          path: .ci/proxy-inference-engine
          ref: ${{ env.PIE_REVISION }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          submodules: recursive

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIE_REVISION"
          ./scripts/build.sh -t Release

      - name: Set up orchard-py
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv --no-config venv .venv
            source .venv/bin/activate
            uv --no-config pip install -e ".[dev]"
          else
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
          fi

      - name: Run full Orchard PY suite
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # Run the exact buckshot gate that publish-dev.yml runs on deploy.
          env -u ORCHARD_CACHE_ROOT -u ORCHARD_IPC_ROOT \
            -u PROXY_GPU_LEASE -u PROXY_GPU_LEASE_HELD \
            PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release" \
            ORCHARD_TEST_LOG_DIR="$PWD/logs_test" \
            scripts/buckshot_gate.sh 1 "$RUNNER_TEMP/buckshot-py" \
            2>&1 | tee "$RUNNER_TEMP/orchard-py-pytest.log"

      - name: Upload Orchard failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-py-logs-${{ github.run_id }}-${{ github.run_attempt }}
          # engine.test.log captures the native engine's stdout and stderr.
          path: |
            logs_test/
            ${{ runner.temp }}/orchard-py-pytest.log
          retention-days: 7