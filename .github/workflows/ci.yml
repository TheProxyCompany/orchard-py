name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: [self-hosted, terminal-0]
    timeout-minutes: 60
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      RUSTUP_TOOLCHAIN: "1.97.1"

    steps:
      - name: Checkout orchard-py
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list cmake || brew install cmake
          brew list ccache || brew install ccache
          brew list rust || brew install rust

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            export PATH="$(brew --prefix rustup)/bin:$PATH"
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rust_bin="$(dirname "$(rustup which rustc)")"
          echo "$rust_bin" >> "$GITHUB_PATH"
          echo "CARGO=$(rustup which cargo)" >> "$GITHUB_ENV"
          echo "RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
          echo "RUSTDOC=$(rustup which rustdoc)" >> "$GITHUB_ENV"
          rustup run "$RUSTUP_TOOLCHAIN" rustc --version
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version

      - name: Checkout reviewed PIE and its private dependencies
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          # Root #38's reviewed engine; testing main would certify another package.
          ref: 99db56ba14ed69abbbb77fc523dddd4e66e575f4
          token: ${{ secrets.GH_PAT }}
          path: .ci/proxy-inference-engine
          submodules: recursive

      - name: Verify reviewed PIE revision
        working-directory: .ci/proxy-inference-engine
        run: |
          pie_expected=99db56ba14ed69abbbb77fc523dddd4e66e575f4
          pie_actual="$(git rev-parse HEAD)"
          echo "PIE revision: $pie_actual"
          test "$pie_actual" = "$pie_expected"
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: |
          ./scripts/build.sh -t Release

      - name: Set up orchard-py
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv --no-config venv .venv
            source .venv/bin/activate
            uv --no-config pip install -e ".[dev]"
          else
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
          fi

      - name: Run full Orchard PY suite
        run: |
          source .venv/bin/activate
          export PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release"
          python - <<'PY'
          import fcntl
          import subprocess
          import sys

          # Shared Apple Silicon runners also host explicit local acceptance
          # runs. Serialize GPU tests without stopping another owned engine.
          with open("/tmp/proxy-gpu.lease", "a") as lease:
              print("Waiting for the runner GPU lease", flush=True)
              fcntl.flock(lease, fcntl.LOCK_EX)
              print("Runner GPU lease acquired", flush=True)
              subprocess.run([
                  sys.executable, "-m", "pytest", "tests/functional",
                  "tests/golden", "tests/unit", "-v", "--tb=short", "-x",
              ], check=True)
          PY
