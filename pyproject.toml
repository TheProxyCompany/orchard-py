[project]
name = "orchard"
version = "2026.6.2"
description = "Python client for Orchard, a compute platform for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "huggingface-hub",
    "fastapi[standard]",
    "jinja2",
    "sse_starlette",
    "filelock",
    "pynng",
    "pyyaml",
    "requests",
]

[project.scripts]
orchard = "orchard.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "build",
    "twine",
    "ruff",
    "pre-commit",
    "ty>=0.0.1a29",
]

[tool.setuptools.packages.find]
include = [
    "orchard*",
]

[tool.setuptools.package-data]
orchard = [
    "formatter/profiles/**",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "PGH",
    "RUF",
    "UP",
    "SLF",
    "F8",
]

[tool.ruff.lint.per-file-ignores]
# The Audio/Images facades are the client's own surface; reaching their
# parent client's internals is the design, not a boundary violation.
"orchard/clients/client.py" = ["SLF001"]
# Tests exercise private seams deliberately.
"tests/**" = ["SLF001"]

[tool.pytest.ini_options]
pythonpath = [
    "tests",
]
addopts = "-m 'not buckshot'"
markers = [
    "buckshot: full-matrix concurrent volley; select with -m buckshot",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "build",
    "twine",
    "ruff",
    "pre-commit",
    "ty>=0.0.1a29",
]
